---
applications:
  - name: nexus-api
    memory: 1G
    disk_quota: 2G
    instances: 1
    timeout: 180
    buildpacks:
      - python_buildpack
    command: gunicorn -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:$PORT --timeout 600 --workers 1
    env:
      LLM_PROVIDER: gemini
      LOG_LEVEL: INFO
      DATA_DIR: /home/vcap/app/data
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      GEMINI_API_KEY: CHANGE_ME
      GEMINI_MODEL: gemini-flash-lite-latest
      GEMINI_BASE_URL: https://generativelanguage.googleapis.com/v1beta
      GEMINI_EXTRACTION_MODEL: ""
      GEMINI_REASONING_MODEL: ""
      GEMINI_GENERAL_MODEL: ""
      GEMINI_RECONCILIATION_MODEL: ""
      XSUAA_URL: ""
      XSUAA_CLIENT_ID: ""
      XSUAA_CLIENT_SECRET: ""
      AICORE_API_URL: ""
      AICORE_RESOURCE_GROUP: default
      AICORE_OPENAI_API_VERSION: 2024-12-01-preview
      AICORE_GPT40_MINI_DEPLOYMENT_ID: ""
      AICORE_GPT55_DEPLOYMENT_ID: ""
      AICORE_GPT41_DEPLOYMENT_ID: ""
      AICORE_GPT40_DEPLOYMENT_ID: ""
